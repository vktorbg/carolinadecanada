# Deploy a Firebase Hosting.
# Se dispara por: push a master, publicacion en Contentful (repository_dispatch)
# o manualmente desde la pestana Actions (workflow_dispatch).
name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - master
  repository_dispatch:
    types: [contentful-publish]
  workflow_dispatch:

# Si se publican varias entradas seguidas en Contentful, cancela los builds
# intermedios y deja solo el ultimo.
concurrency:
  group: firebase-deploy-live
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          CONTENTFUL_SPACE_ID: ${{ secrets.CONTENTFUL_SPACE_ID }}
          CONTENTFUL_ACCESS_TOKEN: ${{ secrets.CONTENTFUL_ACCESS_TOKEN }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CAROLINA_DE_CANADA }}
          channelId: live
          projectId: carolina-de-canada
